<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy and terms documents for the TylerAI Habit Awards Discord bot.">
  <title>TylerAI Habit Awards — Policies</title>
  <style>
    :root { color-scheme: dark; --bg: #10131a; --card: #191e29; --text: #f1f4fa; --muted: #b6c0d4; --accent: #78a9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    article { background: var(--card); border: 1px solid #2b3445; border-radius: 16px; padding: clamp(24px, 5vw, 48px); }
    h1 { margin-top: 0; line-height: 1.2; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: var(--muted); }
    nav { display: grid; gap: 12px; margin-top: 2rem; }
    a { display: block; color: var(--text); background: #0d1016; border: 1px solid #2b3445; border-radius: 10px; padding: 16px 18px; text-decoration: none; }
    a:hover, a:focus-visible { border-color: var(--accent); outline: none; }
    strong { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <article>
    <h1>TylerAI Habit Awards</h1>
    <p>Public policies for the single-community Discord recognition bot.</p>
    <nav aria-label="TylerAI policies">
      <a href="./privacy.html"><strong>Privacy Policy</strong><br>Data use, retention, member choices, and historical-scan safeguards.</a>
      <a href="./terms.html"><strong>Terms of Use</strong><br>Award rules, fair participation, availability, and service limitations.</a>
    </nav>
  </article>
</main>
</body>
</html>
